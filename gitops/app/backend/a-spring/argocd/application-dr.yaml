apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: a-spring
  namespace: argocd
spec:
  ignoreDifferences:
  - group: argoproj.io
    kind: Rollout
    jsonPointers:
    - /spec/replicas
  project: default
  sources:
    - repoURL: http://<Git URL>/infra/charts.git
      targetRevision: HEAD
      path: backend
      helm:
        valueFiles:
          - 'values/dr.yaml'
          - '$values/helm/values.yaml'
          - '$values/helm/values-dr.yaml'
    - repoURL: http://<Git URL>/backend/a-spring.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://<destination-server>:6443
    namespace: <Namespace_A>
  syncPolicy:
    automated:
      prune: true
      selfHeal: true