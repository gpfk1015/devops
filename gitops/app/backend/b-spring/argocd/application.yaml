apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: b-spring
  namespace: argocd
spec:
  ignoreDifferences:
  - group: argoproj.io
    kind: Rollout
    jsonPointers:
    - /spec/replicas
  project: default
  sources:
    - repoURL: http://<Git Repository URL>/infra/charts.git
      targetRevision: HEAD
      path: backend
      helm:
        valueFiles:
          - '$values/helm/values.yaml'
          - '$values/helm/values-scaling-active.yaml'
    - repoURL: http://<Git Repository URL>/backend/b-spring.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://<destination server ip>:6443
    namespace: Namespace_B
  syncPolicy:
    automated:
      prune: true
      selfHeal: true