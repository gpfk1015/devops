apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inaea-external-proxy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://<DR Git Reository URL>/frontend/inaea-external-proxy.git
    targetRevision: HEAD
    path: helm
    helm:
      valueFiles:
        - '../dr/values-dr.yaml'
  destination:
    server: https://<destination server ip>:6443
    namespace: Namespace_B
  syncPolicy:
    automated:
      prune: true
      selfHeal: true