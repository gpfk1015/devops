apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: basics-external-proxy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://<Git Repository URL>/frontend/basics-external-proxy.git
    targetRevision: HEAD
    path: helm
  destination:
    server: https://<destination server ip>:6443
    namespace: Namespace_A
  syncPolicy:
    automated:
      prune: true
      selfHeal: true