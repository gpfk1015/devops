apiVersion: v1
kind: Service
metadata:
  name: sonarqube-minimal-service
  namespace: sonarqube
spec:
  ports:
  - name: gradle
    port: 9000
    protocol: TCP
    targetPort: 9000
  - name: http
    port: 80
    protocol: TCP
    targetPort: 9000
  selector:
    app: sonarqube-minimal
  sessionAffinity: None
  type: ClusterIP