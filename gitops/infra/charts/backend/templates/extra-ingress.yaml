{{- if .Values.extraIngress}}
{{- range .Values.extraIngress }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Values.applicationName }}-{{ .name }}
  labels:
    app: {{ $.Values.applicationName }}
  annotations:
    kubernetes.io/ingress.class: "default"
    konghq.com/preserve-host: "true"
    konghq.com/request-buffering: "false"
spec:
  rules:
    {{- range .hosts }}
    - host: "{{ .host }}"
      http:
        paths:
          {{- range .paths }}
          - path: "{{ .path }}"
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Values.applicationName }}
                port:
                  number: 80
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}