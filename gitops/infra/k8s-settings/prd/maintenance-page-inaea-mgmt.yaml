apiVersion: configuration.konghq.com/v1
kind: KongClusterPlugin
metadata:
  name: maintenance-page-inaea
  namespace: Namespace_B
  annotations:
    kubernetes.io/ingress.class: mgmt
    konghq.com/tags: ''
  labels:
    global: 'true'
config:
  access:
  - |-
    -- 공사중 모드를 활성화하려면 이 값을 true로 변경하세요.
    -- 점검이 끝나면 다시 false로 변경하면 됩니다.
    local maintenance_mode = false

    -- 예외 처리할(점검 페이지를 안 볼) IP 목록
    local whitelist = {
      "14.63.186.130",   -- 단일 IP
      "10.11.12."        -- 10.11.12.0/24 대역 (10.11.12. 로 시작하는 모든 IP 허용)
    }

    local client_ip = kong.client.get_forwarded_ip()
    local is_whitelisted = false

    -- 클라이언트 IP가 존재하는 경우 화이트리스트와 비교
    if client_ip then
      for _, prefix in ipairs(whitelist) do
        -- 접속 IP의 앞부분 글자가 whitelist에 등록된 글자와 일치하는지 확인
        if string.sub(client_ip, 1, string.len(prefix)) == prefix then
          is_whitelisted = true
          break
        end
      end
    end

    if maintenance_mode and not is_whitelisted then
      -- 공사중 페이지 HTML을 직접 반환합니다.
      -- Kong은 이 응답을 캐시할 수 있습니다.
      local maintenance_html = [[
          <html lang="ko">
            <head>
              <link rel="stylesheet" href="https://static.basics.go.kr/public/common/styles/_root.css" />
              <link rel="stylesheet" href="https://static.basics.go.kr/public/common/styles/style.css" />
            </head>
            <body>
              <div class="page-not-found">
                <div class="inner">
                  <div class="error-contents">
                    <div class="error-content system-check">
                      <div class="icon">
                        <Image src="https://static.basics.go.kr/public/common/images/common/system-check.svg" width={150} height={150} alt="" />
                      </div>
                      <div class="text">
                        <div class="title">특성화고 서비스 지원을 위한 시스템 작업 안내</div>
                        <div class="desc">
                          학업성취도평가시스템의 특성화고 서비스 지원을 위해
                          <br> 시스템 개선 작업을 실시할 예정입니다.
                          <br> 점검 시간 동안 서비스 이용이 제한될 예정이오니
                          <br>참고해 주시기 바랍니다.
                        </div>
                      </div>
                      <dl class="time">
                        <dt class="tit">서비스 중단 시간</dt>
                        <dd class="txt">2026년 03월 13일(금) 19:00 ~ 23:59, 약 5시간</dd>
                      </dl>
                    </div>
                  </div>
                </div>
              </div>
            </body>
          </html>
      ]]

      -- 503 Service Unavailable 상태 코드와 함께 HTML 반환
      return kong.response.exit(503, maintenance_html, {
        ["Content-Type"] = "text/html; charset=utf-8"
      })
    end
plugin: pre-function