apiVersion: v1
data:
  Corefile: |
    re.kr:53 {
        forward . 172.30.21.116 {
            policy sequential
            health_check 2s
            max_fails 2
        }
        cache 30
        errors
     }

    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }

        template IN A prod1-tokenserver.backend {
            match ^prod1-tokenserver\.backend\.$
            answer "{{ .Name }} 60 IN A 172.30.81.181"
        }

        template IN A backend {
            match ^[a-z0-9-]+\.backend\.$
            answer "{{ .Name }} 60 IN A 172.30.101.181"
        }

        template IN A <namespace>.svc {
            match ^[a-z0-9-]+\.<namespace>\.svc\.$
            answer "{{ .Name }} 60 IN A 172.30.81.181"
        }

        hosts {
            172.30.41.181 synapdoc.external
            172.30.41.182 smartform.external
            172.30.21.182 epki.external
            fallthrough
        }

        prometheus :9153
        forward . /etc/resolv.conf {
            max_concurrent 1000
        }
        cache 30
        loop
        reload
        loadbalance
    }
kind: ConfigMap
