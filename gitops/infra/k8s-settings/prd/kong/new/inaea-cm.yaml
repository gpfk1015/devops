apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-error-template
  namespace: serengeti-kong
data:
  error.html: |
    <!DOCTYPE html>
    <html lang="ko">
    <head>
      <meta charset="UTF-8" />
      <title>학업성취도평가지원포털</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="stylesheet" href="https://static.basics.go.kr/public/common/styles/_root.css" />
      <link rel="stylesheet" href="https://static.basics.go.kr/public/common/styles/style.css" />

      <style>
        .customBtn{
          font-weight: 600 !important;
          font-size: 17px;
          line-height: 1.3 !important;
          padding: 0 1rem;
          background: #0165c0;
          border-color: #0165c0;
          color: #fff;
          border-radius: 0.5rem;
          height: var(--form-height);
        }
      </style>
      <script>
        const DEFAULT_ERROR_CONFIG = {
          title: "요청을 처리할 수 없습니다",
          message: "요청이 정상적으로 처리되지 않았습니다.",
          details: [
            "페이지가 만료되었거나 올바르지 않은 접근일 수 있습니다.",
            "'이전 화면' 또는 '홈으로' 이동해 주세요."
          ]
        };

        function getSearchParams() {
          return new URLSearchParams(window.location.search);
        }

        function renderErrorPage() {
          const params = getSearchParams();
          const isPrevPage = params.get("isPrevPage");
          const redirectUrl = params.get("redirectUrl");

          const showHomeButton = true;
          const showPrevButton = isPrevPage === "true";

          // 제목 / 메시지
          document.querySelector(".error-title").textContent =
            DEFAULT_ERROR_CONFIG.title;
          document.querySelector(".error-message").textContent =
            DEFAULT_ERROR_CONFIG.message;

          // 상세 문구 처리
          const detailsContainer = document.querySelector(".error-details");
          detailsContainer.innerHTML = "";

          DEFAULT_ERROR_CONFIG.details.forEach(detail => {
            let finalDetail = detail;

            if (!showHomeButton) {
              finalDetail = finalDetail.replace(
                "'이전 화면' 또는 '홈으로' 이동해 주세요.",
                "'이전 화면'으로 이동해 주세요."
              );
            }

            if (!showPrevButton) {
              finalDetail = finalDetail.replace(
                "'이전 화면' 또는 '홈으로' 이동해 주세요.",
                "'홈으로' 이동해 주세요."
              );
            }

            const div = document.createElement("div");
            div.className = "error-detail-item";
            div.textContent = finalDetail;
            detailsContainer.appendChild(div);
          });

          // 버튼 노출 제어
          const prevBtn = document.getElementById("prevButton");
          const homeBtn = document.getElementById("homeButton");

          if (showPrevButton || !showHomeButton) {
            prevBtn.style.display = "inline-block";
          } else {
            prevBtn.style.display = "none";
          }

          if (showHomeButton) {
            homeBtn.style.display = "inline-block";
            homeBtn.onclick = () => handleGoHome(redirectUrl);
          } else {
            homeBtn.style.display = "none";
          }
        }

        function handleGoBack() {
          history.back();
        }

        function handleGoHome(redirectUrl) {
          if (redirectUrl && redirectUrl.startsWith(window.location.origin)) {
            window.location.assign(redirectUrl);
          } else {
            window.location.href = redirectUrl || "/";
          }
        }

        document.addEventListener("DOMContentLoaded", renderErrorPage);
      </script>
    </head>

    <body>
      <div class="page-not-found">
        <div class="inner">
          <div class="error-contents">
            <div class="error-content">
              <div class="error-content-inner">
                <div>
                  <div class="error-title-wrap">
                    <div class="error-title"></div>
                  </div>
                  <div class="error-message"></div>
                </div>
              </div>

              <div class="error-details"></div>
            </div>

            <div class="cm-btn-area center mt-30">
              <button
                id="prevButton"
                type="button"
                class="btn btn-lg btn11 customBtn"
                onclick="handleGoBack()"
              >
                이전화면
              </button>

              <button
                id="homeButton"
                type="button"
                class="btn btn-lg btn3 customBtn"
              >
                홈으로
              </button>
            </div>
          </div>
        </div>
      </div>
    </body>
    </html>
---
