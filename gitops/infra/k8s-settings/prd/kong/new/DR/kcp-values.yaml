replicaCount: 3

env:
  database: "off"
  log_level: info
  trusted_ips: "0.0.0.0/0,::/0"
  real_ip_header: "proxy_protocol"
  real_ip_recursive: "on"
  NGINX_PROXY_PROXY_BUFFER_SIZE: "160k"
  NGINX_PROXY_PROXY_BUFFERS: "64 160k"

image:
  repository: <<Registry URL>>/library/kong
  tag: "3.9"
  pullPolicy: IfNotPresent

proxy:
  enabled: true
  type: LoadBalancer
  loadBalancerIP: 172.20.11.25
  annotations:
    loadbalancer.nhncloud/loadbalancer-name: "dr-cmp-default-ingress"
    loadbalancer.openstack.org/network-id: "445824ba-cdd1-4c52-bad9-fd41638c6738"
    loadbalancer.openstack.org/subnet-id: "ae620191-42ed-4b91-b064-da68c3405958"
    loadbalancer.nhncloud/member-subnet-id: "21359aef-775d-4671-911e-0847bd45320e"
    loadbalancer.nhncloud/loadbalancer-type: "dedicated"
    service.beta.kubernetes.io/openstack-internal-load-balancer: "true"
    loadbalancer.nhncloud/listener-protocol: TCP
    loadbalancer.nhncloud/proxy-protocol: "true"
  http:
    enabled: true
    # nodePort: 30080
    parameters:
      - proxy_protocol
  tls:
    enabled: true
    # nodePort: 30443
    parameters:
      - proxy_protocol

ingressController:
  enabled: true
  ingressClass: default
  # installCRDs: true
  ingressClassAnnotations:
    ingressclass.kubernetes.io/is-default-class: "true"
  image:
    repository: <<Registry URL>>/library/kong/kubernetes-ingress-controller
    tag: "3.5"
    pullPolicy: IfNotPresent
